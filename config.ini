# Valores de fábrica. Este fichero viaja con el código y se actualiza con él,
# así que editarlo en un servidor hace que cada "git pull" dé un conflicto.
#
# Para configurar una instalación concreta usa .env, que no se versiona: cada
# ajuste de aquí lleva encima su variable de entorno («· env»), y la variable
# siempre manda sobre el valor de este fichero.

[server]
# Puerto en el que escucha la app y que se publica en el host.
# · env PORT
port = 8000

# Tamaño máximo de una subida, en MB. 0 = sin límite, que es el comportamiento
# histórico y lo razonable en una LAN. Ponle un número si el servidor está
# expuesto: quien pueda subir puede llenarte el disco.
# · env MAX_UPLOAD_MB
max_upload_mb = 0

# Cuota total por usuario, en MB. 0 = sin cuota.
# · env USER_QUOTA_MB
user_quota_mb = 0

# MB que se reservan siempre libres en el volumen de datos. Una subida que
# fuera a bajar de este umbral se rechaza y se borra. Esto NO es opcional: sin
# ello el disco se llena hasta que SQLite ya no puede ni escribir, y a partir de
# ahí no funciona nada, ni siquiera borrar lo que sobra para recuperarse.
# · env MIN_FREE_DISK_MB
min_free_disk_mb = 1024

# Segundos que una petición espera a que se libere la base de datos. El valor
# por defecto de sqlite3 (5) se queda corto con subidas grandes y varios
# workers.
# · env DB_TIMEOUT_SECONDS
db_timeout_seconds = 30

[security]
# Ponlo a true SOLO si hay un proxy inverso con TLS delante (nginx, Caddy,
# Traefik). Activa la lectura de las cabeceras X-Forwarded-*, sin las cuales
# todas las peticiones parecen venir de la IP del proxy: el log de acceso no
# distingue a nadie y el bloqueo por intentos fallidos se vuelve inútil.
# · env BEHIND_PROXY
behind_proxy = false

# Marca Secure en las cookies de sesión. "auto" = igual que behind_proxy, que
# es lo correcto casi siempre: activarlo sin TLS delante deja el login en un
# bucle sin mensaje de error, porque el navegador nunca devuelve la cookie.
# · env SECURE_COOKIES
secure_cookies = auto

# Longitud mínima de las contraseñas nuevas. No afecta a las ya existentes.
# · env MIN_PASSWORD_LENGTH
min_password_length = 12

# Intentos fallidos de login desde una misma IP antes de bloquearla, y ventana
# en minutos en la que se cuentan. El bloqueo se levanta solo.
# · env LOGIN_MAX_ATTEMPTS
login_max_attempts = 10
# · env LOGIN_WINDOW_MINUTES
login_window_minutes = 15

# El HTTPS con certificado propio NO se configura aquí: se activa desde
# Administración → HTTPS, y su estado vive en el volumen de datos junto a los
# certificados (ni config.ini ni .env se pueden escribir desde el contenedor).
#
# Lo único que hay aquí es la salida de emergencia: HTTPS_ENABLED=false en .env
# fuerza el arranque en HTTP aunque haya certificados. Sirve para recuperar el
# servidor si un certificado roto impide que arranque, sin tener que entrar a
# borrar ficheros del volumen a mano.
# · env HTTPS_ENABLED
